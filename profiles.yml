
transform:
  outputs:
    dbt_subprocess:
      account: "{{ env_var('ACCOUNT_IDENTIFIER') }}"
      database: SPOTIFY_PIPELINE
      private_key: "{{ env_var('PRIVATE_KEY') }}"
      role: SPOTIFY_PIPELINE_ROLE
      schema: STAGING
      threads: 1
      type: snowflake
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      warehouse: COMPUTE_WH
  target: dbt_subprocess


